# MUST be rejected: maximum_drift is a Ratio (0-1) (opensrm-l33e).
# One defect only: `maximum_drift: 1.5`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: stability
      probe:
        frozen_input_set: "s3://probes/credit-decision-2026q1.jsonl"
        frequency: daily
      bounds:
        maximum_drift: 1.5
