# MUST be rejected: audit_backlog_maximum_age left audit_sampling's target in
# opensrm-l33e. Declare judgment_threshold: [{type: audit_backlog, bounds:
# {maximum_age: 24h}}] on the ServiceManifest instead.
apiVersion: opensrm.nthlayer.io/v2
kind: JudgmentSLO
metadata:
  name: moderation-agent-audit
  namespace: default
spec:
  service: moderation-agent
  judgment_type: audit_sampling
  sampling:
    overall_rate: 0.01
    stratified:
      - segment: high_stakes
        rate: 0.1
      - segment: low_confidence
        rate: 0.25
  target:
    audit_backlog_maximum_age: 24h
    audit_completion_rate: 0.95
