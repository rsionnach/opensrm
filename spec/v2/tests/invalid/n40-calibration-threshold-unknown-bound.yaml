# MUST be rejected: calibration bounds is closed, so a misspelled bound
# is an error rather than an unenforced limit (opensrm-l33e).
# One defect only: `maximum_brier` beside the correct
# `maximum_brier_score`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement:
        bins: 10
        window: 30d
      bounds:
        maximum_brier_score: 0.05
        maximum_brier: 0.05
