# MUST be rejected: a segments item is a judgment threshold, not a judgment SLO (opensrm-l33e). Inline in a ServiceManifest, judgment_slo must not accept it.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_slo:
    - service: refund-approver
      judgment_type: segments
      segment_dimension: customer_tier
      segment_values: [enterprise, smb]
      target: { maximum_variance_from_overall: 0.05 }
