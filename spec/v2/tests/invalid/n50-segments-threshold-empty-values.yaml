# MUST be rejected: `segment_values` must name at least one segment
# (opensrm-l33e).
# One defect only: `segment_values: []`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: outcomes
      segment_dimension: customer_tier
      segment_values: []
      bounds:
        maximum_variance_from_overall: 0.05
