# MUST be rejected: calibration is not a judgment SLO in v2 (decision 3c). This was
# examples/judgment-slos/08-calibration.yaml until opensrm-l33e; declare it under a
# ServiceManifest's spec.judgment_threshold instead.
apiVersion: opensrm.nthlayer.io/v2
kind: JudgmentSLO
metadata:
  name: investigation-agent-calibration
  namespace: default
spec:
  service: investigation-agent
  judgment_type: calibration
  measurement:
    bins: 10
    window: 30d
    method: brier_score
  target:
    maximum_brier_score: 0.05
