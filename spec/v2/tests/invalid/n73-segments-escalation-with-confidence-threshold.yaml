# MUST be rejected: confidence_threshold parameterises high_confidence_failure only (opensrm-7zpz).
# One defect only: `metric: escalation` with `measurement.confidence_threshold`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: escalation
      measurement:
        confidence_threshold: 0.9
      segment_dimension: customer_tier
      segment_values: [enterprise, smb, consumer]
      bounds:
        maximum_variance_from_overall: 0.05
