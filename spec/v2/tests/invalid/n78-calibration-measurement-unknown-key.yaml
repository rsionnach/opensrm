# MUST be rejected: calibration measurement is closed (opensrm-7zpz).
# One defect only: `measurement.bin`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement:
        bins: 10
        window: 30d
        bin: 20
      bounds:
        maximum_expected_calibration_error: 0.05
