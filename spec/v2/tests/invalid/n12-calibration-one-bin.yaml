# MUST be rejected: calibration bins below the schema floor of 2.
# One bin is not a reliability curve (AUTHORING.md §5.8).
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement: { bins: 1, window: 30d }
      bounds: { maximum_brier_score: 0.05 }
