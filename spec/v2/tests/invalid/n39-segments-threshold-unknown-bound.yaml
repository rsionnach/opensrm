# MUST be rejected: segments bounds is closed, so a misspelled bound is
# an error rather than an unenforced limit (opensrm-l33e).
# One defect only: `maximum_variance` beside the correct
# `maximum_variance_from_overall`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: escalation
      segment_dimension: customer_tier
      segment_values: [enterprise, smb, consumer]
      bounds:
        maximum_variance_from_overall: 0.05
        maximum_variance: 0.05
