# MUST be rejected: maximum_variance_from_overall is a Ratio (0-1)
# (opensrm-l33e).
# One defect only: `maximum_variance_from_overall: 1.5`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: outcomes
      segment_dimension: customer_tier
      segment_values: [enterprise, smb, consumer]
      bounds:
        maximum_variance_from_overall: 1.5
