# MUST be rejected: calibration `measurement` requires `window`
# (opensrm-l33e).
# One defect only: `measurement.window` omitted.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement:
        bins: 10
      bounds:
        maximum_brier_score: 0.05
