# MUST be rejected: stability is not a judgment SLO in v2 (decision 3c). This was
# examples/judgment-slos/07-stability.yaml until opensrm-l33e; declare it under a
# ServiceManifest's spec.judgment_threshold instead.
apiVersion: opensrm.nthlayer.io/v2
kind: JudgmentSLO
metadata:
  name: content-classifier-stability
  namespace: default
spec:
  service: content-classifier
  judgment_type: stability
  probe:
    frozen_input_set: "s3://probes/content-classifier-2026q1.jsonl"
    frequency: daily
  target:
    maximum_drift: 0.02
