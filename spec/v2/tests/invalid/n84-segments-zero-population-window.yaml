# MUST be rejected: a zero population window could never be evaluated (opensrm-7zpz).
# One defect only: `measurement.window: 0d`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: escalation
      measurement:
        window: 0d
      segment_dimension: customer_tier
      segment_values: [enterprise, smb, consumer]
      bounds:
        maximum_variance_from_overall: 0.05
