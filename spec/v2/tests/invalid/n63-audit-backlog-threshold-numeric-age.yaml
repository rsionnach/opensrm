# MUST be rejected: maximum_age is a Duration string; a bare number has
# no unit (opensrm-l33e).
# One defect only: `maximum_age: 24`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: audit_backlog
      bounds:
        maximum_age: 24
