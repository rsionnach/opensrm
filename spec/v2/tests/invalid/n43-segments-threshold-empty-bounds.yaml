# MUST be rejected: a segments threshold must declare
# maximum_variance_from_overall; an empty bounds object bounds nothing
# (opensrm-l33e).
# One defect only: `bounds: {}`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: outcomes
      segment_dimension: customer_tier
      segment_values: [enterprise, smb, consumer]
      bounds: {}
