# MUST be rejected: breach_actions is not a threshold key (opensrm-l33e). A block carried over from judgment_slo must fail rather than be silently ignored.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: stability
      probe: { frozen_input_set: "s3://probes/x.jsonl", frequency: daily }
      bounds: { maximum_drift: 0.02 }
      breach_actions:
        - type: escalate
