# Judgment SLO: audit_sampling — human audit sampling rates + completion target.
# The backlog bound that used to sit here is a judgment_threshold
# (type: audit_backlog) since opensrm-l33e; see ../judgment-thresholds/.
apiVersion: opensrm.nthlayer.io/v2
kind: JudgmentSLO
metadata:
  name: moderation-agent-audit
  namespace: default
spec:
  service: moderation-agent
  judgment_type: audit_sampling
  sampling:
    overall_rate: 0.01
    stratified:
      - segment: high_stakes
        rate: 0.1
      - segment: low_confidence
        rate: 0.25
  target:
    audit_completion_rate: 0.95
