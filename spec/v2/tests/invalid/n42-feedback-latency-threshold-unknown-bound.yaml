# MUST be rejected: feedback_latency bounds is closed, so a misspelled
# bound is an error rather than an unenforced limit (opensrm-l33e).
# One defect only: `maximum_p99` beside the correct `maximum_p50`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: feedback_latency
      bounds:
        maximum_p50: 1h
        maximum_p99: 48h
