# MUST be rejected: maximum_expected_calibration_error is a Ratio (0-1)
# (opensrm-l33e).
# One defect only: `maximum_expected_calibration_error: 1.5`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement:
        bins: 10
        window: 30d
      bounds:
        maximum_expected_calibration_error: 1.5
