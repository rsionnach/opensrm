# MUST be rejected: a segment_values entry is an empty string (opensrm-l33e).
# One defect only: segment_dimension is otherwise valid.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: escalation
      segment_dimension: customer_tier
      segment_values: [enterprise, ""]
      bounds: { maximum_variance_from_overall: 0.05 }
