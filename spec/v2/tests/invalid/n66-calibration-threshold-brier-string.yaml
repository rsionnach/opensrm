# MUST be rejected: maximum_brier_score is a number; a quoted value
# is a string, which the 0-1 range check alone would not catch
# (opensrm-l33e; design spec §1.1 types it "number, 0–1").
# One defect only: `maximum_brier_score: "0.05"`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement:
        bins: 10
        window: 30d
      bounds:
        maximum_brier_score: "0.05"
