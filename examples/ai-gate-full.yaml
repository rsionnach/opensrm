# Full AI gate manifest with all judgment SLOs
apiVersion: srm/v1
kind: ServiceReliabilityManifest
metadata:
  name: pr-review-agent
  team: platform
  tier: critical

spec:
  type: ai-gate

  contract:
    availability: 0.999
    latency:
      p99: 10s
    judgment:
      max_reversal_rate: 0.05
      max_hcf_rate: 0.02

  slos:
    # Traditional SLOs
    availability:
      target: 0.999
      window: 30d
    latency:
      p99: 5s
      target: 0.99

    # Judgment SLOs
    judgment:
      reversal_rate:
        target: 0.03
        window: 30d
        observation_period: 24h

      high_confidence_failure:
        target: 0.01
        window: 30d
        confidence_threshold: 0.9

      calibration:
        target: 0.10
        window: 30d

      feedback_latency:
        p50: 48h
        p90: 168h

  instrumentation:
    events:
      decision: ai_gate.decision
      reversal: ai_gate.reversal
      outcome: ai_gate.outcome
    attributes:
      decision_id: decision_id
      confidence: confidence
      decision: decision

  dependencies:
    - service: claude-api
      type: external
      critical: true
    - service: github-api
      type: external
      critical: true
    - service: postgresql
      type: database
      critical: true

  observability:
    metrics:
      required:
        - ai_gate_decisions_total
        - ai_gate_reversals_total
        - ai_gate_confidence_bucket
    dashboards:
      required: true
    alerts:
      required: true

  ownership:
    team: platform
    escalation: platform-oncall
    runbook: https://wiki.example.com/pr-review-agent
