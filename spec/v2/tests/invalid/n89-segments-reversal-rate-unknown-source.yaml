# MUST be rejected: measurement.source takes the reversal_rate SLO's values: lineage, calibration_sample or downstream_signal (CORE §5.2.1, §5.5.1, opensrm-7zpz).
# One defect only: `source: audit`.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      metric: reversal_rate
      measurement:
        source: audit
      segment_dimension: customer_tier
      segment_values: [enterprise, smb, consumer]
      bounds:
        maximum_variance_from_overall: 0.05
