# MUST be rejected: a segments threshold requires `segment_values`
# (opensrm-l33e).
# One defect only: `segment_values` omitted.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: segments
      segment_dimension: customer_tier
      bounds:
        maximum_variance_from_overall: 0.05
