# MUST be rejected: a bound that does not belong to the type (bounds is closed).
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: stability
      probe: { frozen_input_set: "s3://probes/x.jsonl", frequency: daily }
      bounds: { maximum_drift: 0.02, maximum_variance_from_overall: 0.05 }
