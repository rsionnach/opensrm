apiVersion: opensrm/v1
kind: ServiceReliabilityManifest
metadata:
  name: code-review-bot
  team: developer-experience
  tier: standard
  template: ai-gate-standard
spec:
  type: ai-gate

  contract:
    availability: 0.999
    latency:
      p99: 60s
    judgment:
      max_reversal_rate: 0.05
      max_hcf_rate: 0.02

  slos:
    availability:
      target: 0.9995
      window: 30d
    latency:
      p99: 45s
      target: 0.99
      window: 30d
    judgment:
      reversal_rate:
        target: 0.03
        window: 30d
        observation_period: 7d
      high_confidence_failure:
        target: 0.01
        confidence_threshold: 0.85
        window: 30d
      calibration:
        target: 0.12
        window: 30d
      feedback_latency:
        p50: 4h
        p90: 48h

  dependencies:
    - service: llm-gateway
      type: service
      critical: true
      expects:
        availability: 0.999
        latency:
          p99: 30s
    - service: github-api
      type: external
      critical: true
      expects:
        availability: 0.999

  ownership:
    team: developer-experience
    slack: "#dx-oncall"
    runbook: https://wiki.example.com/runbooks/code-review-bot

  instrumentation:
    events:
      decision: ai_gate.decision
      reversal: ai_gate.reversal
      outcome: ai_gate.outcome
    attributes:
      decision_id: ai_gate.decision_id
      confidence: ai_gate.confidence
      decision_value: ai_gate.decision
