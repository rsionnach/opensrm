# MUST be rejected: a stability probe requires `frequency`
# (opensrm-l33e).
# One defect only: `probe.frequency` omitted.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: stability
      probe:
        frozen_input_set: "s3://probes/credit-decision-2026q1.jsonl"
      bounds:
        maximum_drift: 0.02
