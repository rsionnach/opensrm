# MUST be rejected: segments is not a judgment SLO in v2 (decision 3c). This was
# examples/judgment-slos/06-segments.yaml until opensrm-l33e; declare it under a
# ServiceManifest's spec.judgment_threshold instead.
apiVersion: opensrm.nthlayer.io/v2
kind: JudgmentSLO
metadata:
  name: credit-decision-agent-segments
  namespace: default
spec:
  service: credit-decision-agent
  judgment_type: segments
  segment_dimension: customer_tier
  segment_values: [enterprise, smb, consumer]
  target:
    maximum_variance_from_overall: 0.05
