# NEGATIVE FIXTURE — must be REJECTED by spec/v2/schema.json.
#
# The empty-list boundary of the n13 rule. What §3.1 forbids is the KEY,
# not its contents: an api declaring `judgment_slo: []` has declared the
# block, and is rejected exactly as one declaring a populated list is.
# A tool that emits empty collections by default must omit the key here.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: checkout-api
spec:
  owner:
    group: "group:default/payments"
  service:
    name: checkout-api
    type: api
  judgment_slo: []
