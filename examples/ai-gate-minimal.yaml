# Minimal AI gate manifest - start here
apiVersion: opensrm/v1
kind: ServiceReliabilityManifest
metadata:
  name: code-reviewer
  team: platform
  tier: standard
  description: Automated code review agent

spec:
  type: ai-gate

  observability:
    metrics:
      required:
        - ai_gate_decisions_total
        - ai_gate_reversals_total

  slos:
    availability:
      target: 0.999
      window: 30d

    judgment:
      reversal_rate:
        target: 0.05
        window: 30d

  instrumentation:
    events:
      decision: ai_gate.decision
      reversal: ai_gate.reversal

  ownership:
    team: platform
    slack: "#platform-alerts"
    runbook: https://wiki.example.com/code-reviewer
