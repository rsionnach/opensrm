# MUST be rejected: thresholds use `type`, not `judgment_type` (opensrm-l33e). The stale key must fail rather than be silently ignored.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: stability
      judgment_type: stability
      probe: { frozen_input_set: "s3://probes/x.jsonl", frequency: daily }
      bounds: { maximum_drift: 0.02 }
