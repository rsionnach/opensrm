# MUST be rejected: service is not a threshold key (opensrm-l33e). Thresholds are inline and the enclosing manifest's service is implied; an entry carried over from judgment_slo (or copied from another manifest) must fail rather than silently attach here.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: stability
      service: other-svc
      probe: { frozen_input_set: "s3://probes/x.jsonl", frequency: daily }
      bounds: { maximum_drift: 0.02 }
