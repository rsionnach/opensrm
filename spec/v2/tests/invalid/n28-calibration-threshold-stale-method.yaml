# MUST be rejected: measurement.method was removed in opensrm-l33e —
# the declared bounds decide what is evaluated, so a stale method key
# fails loudly.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement: { bins: 10, window: 30d, method: brier_score }
      bounds: { maximum_brier_score: 0.05 }
