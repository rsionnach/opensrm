# MUST be rejected: calibration `measurement` requires `bins`
# (opensrm-l33e).
# One defect only: `measurement.bins` omitted.
apiVersion: opensrm.nthlayer.io/v2
kind: ServiceManifest
metadata:
  name: refund-approver
spec:
  owner:
    group: group:default/payments
  service:
    name: refund-approver
    type: ai-gate
  judgment_threshold:
    - type: calibration
      measurement:
        window: 30d
      bounds:
        maximum_brier_score: 0.05
